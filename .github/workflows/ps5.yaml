name: Build PS5

# This fork only ships the PlayStation 5 port, so the build that matters is
# the one below. The upstream workflows for the other platforms are kept in
# the tree untouched and are disabled in the fork's Actions settings.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      disable_unity_build:
        description: 'Disable unity build'
        required: false
        default: 'false'

concurrency:
  group: ps5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      DIST_PS5: ${{ steps.info.outputs.DIST_PS5 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Version
        id: info
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_PS5=wiliwili-PS5-${VERSION}" >> $GITHUB_OUTPUT

  build-ps5:
    needs: [ version ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 meson ninja-build pkg-config
          echo "LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config" >> $GITHUB_ENV

      # ps5-payload-dev ships a cross compilation sysroot with SDL2, ffmpeg,
      # mesa, libass, curl and the prospero LLVM toolchain wrappers
      - name: Install SDK
        run: |
          scripts/ps5/install_sdk.sh "$HOME/ps5-payload-sdk"
          echo "PS5_PAYLOAD_SDK=$HOME/ps5-payload-sdk" >> $GITHUB_ENV

      - name: Build
        env:
          BRLS_UNITY_BUILD: ${{ github.event.inputs.disable_unity_build == 'true' && 'OFF' || 'ON' }}
        run: |
          scripts/build_ps5.sh

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.version.outputs.DIST_PS5 }}
          path: "cmake-build-ps5/ps5"

  # The payload build above is a web-launched homebrew: its folder holds an
  # eboot.elf that the console's browser launcher starts. What a console
  # installed below /data/homebrew/PPSA99099 runs is the native title, one
  # static image signed into an eboot.bin, and that is assembled by
  # scripts/ps5/title - the same script the local deploy uses. It needs the
  # pinned third party sources (about 700 MB, cached between runs) and takes
  # the application through a second link.
  build-ps5-title:
    needs: [ version ]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The paths scripts/ps5/title/env.sh derives from the deps directory;
      # they are spelled out here because env.sh also picks the compiler by
      # platform, and the runner's clang-18 is not where Homebrew keeps it.
      PS5_DEPS_PREFIX: ${{ github.workspace }}/ps5-deps
      PS5_PAYLOAD_SDK: ${{ github.workspace }}/ps5-deps/ps5-payload-sdk
      PS5_OPENGL_CHECKOUT: ${{ github.workspace }}/ps5-deps/ps5-opengl
      PS5_OPENGL_PREFIX: ${{ github.workspace }}/ps5-deps/ps5-opengl-sdk-1.0.2/sdk
      PS5_BOILERPLATE: ${{ github.workspace }}/ps5-deps/ps5-native-app-boilerplate
      PS5_SDL_SOURCE: ${{ github.workspace }}/ps5-deps/SDL2
      PS5_SDL2_PREFIX: ${{ github.workspace }}/ps5-deps/ps5-opengl/build/sdl2-native/sdk
      PS5_NATIVE_TOOL: ${{ github.workspace }}/ps5-deps/ps5-native-app-boilerplate/build-host/ps5-native-tool
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 meson ninja-build \
            pkg-config cmake python3 curl wget unzip zlib1g-dev

      # The distribution keeps the suffixed names in /usr/bin and the whole
      # toolchain, the utilities beside the compiler included, in the LLVM
      # prefix llvm-config reports.
      - name: Locate LLVM 18
        run: |
          bindir=$(llvm-config-18 --bindir)
          for tool in clang clang++ llvm-config llvm-ar llvm-nm llvm-objcopy llvm-readelf; do
            test -x "$bindir/$tool" || { echo "$bindir/$tool is missing" >&2; exit 1; }
          done
          {
            echo "PS5_CLANG=$bindir/clang"
            echo "LLVM_CONFIG=$bindir/llvm-config"
            echo "CXX=$bindir/clang++"
          } >> $GITHUB_ENV

      - name: Cache the pinned sources
        uses: actions/cache@v4
        with:
          path: ${{ env.PS5_DEPS_PREFIX }}
          key: ps5-title-deps-${{ hashFiles('scripts/ps5/title/fetch_deps.sh', 'scripts/ps5/install_sdk.sh') }}

      - name: Fetch dependency
        run: scripts/ps5/title/fetch_deps.sh "${PS5_DEPS_PREFIX}"

      # The SDK ships the ffmpeg it was built with but not mpv: the payload
      # build has the same step, and the title links the archive it installs.
      - name: Build libmpv
        run: |
          if ! "${PS5_PAYLOAD_SDK}/bin/prospero-pkg-config" --exists mpv; then
            scripts/ps5/build_libmpv.sh
          fi

      - name: Build the module converter
        run: scripts/ps5/title/build_native_tool.sh

      - name: Build the static SDL2
        run: scripts/ps5/title/build_sdl2.sh

      # The clean-room runtime module the title loads beside its image is
      # generated from the boilerplate's own sources, not shipped with it.
      - name: Build the runtime module
        run: |
          bindir=$(llvm-config-18 --bindir)
          make -C "$PS5_BOILERPLATE" libc USE_CCACHE=0 \
            HOST_CC="$bindir/clang" HOST_CXX="$bindir/clang++"

      - name: Configure
        env:
          BRLS_UNITY_BUILD: ${{ github.event.inputs.disable_unity_build == 'true' && 'OFF' || 'ON' }}
        run: |
          cmake -B cmake-build-ps5-title -DCMAKE_BUILD_TYPE=Release -DPLATFORM_PS5=ON \
            -DPS5_NATIVE_TITLE=ON -DUSE_LIBROMFS=ON -DBRLS_UNITY_BUILD=${BRLS_UNITY_BUILD} \
            -DCMAKE_UNITY_BUILD_BATCH_SIZE=16

      - name: Build
        run: cmake --build cmake-build-ps5-title --target wiliwili.title -j$(nproc)

      - name: Upload title
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.version.outputs.DIST_PS5 }}-title
          path: "dist/PPSA99099"
